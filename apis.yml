aid: mazamaenergy
name: Mazama Energy
description: Mazama Energy is a geothermal energy company reinventing power generation
  with enhanced geothermal systems (EGS) that tap superhot rock to deliver universal,
  scalable, clean, and affordable electricity. Its Thermal Lattice sequential-stimulation
  technology improves connectivity between injectors and producers in super hot reservoirs
  (SHR). The company is developing the Newberry project in Oregon and runs the Mazama
  EMPOWER program, and is backed by Khosla Ventures. Headquartered in Frisco, Texas.
